<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mark的小工具">
  <title>Mark的小工具</title>
  <style>
    :root {
      --bg: #eef4fb;
      --panel: rgba(255, 255, 255, .88);
      --text: #101828;
      --muted: #64748b;
      --line: rgba(156, 178, 207, .42);
      --blue: #1268ff;
      --soft: #f3f7fc;
      --ok: #047857;
      --warn: #b42318;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 4%, rgba(65, 190, 255, .34), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(18, 104, 255, .24), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    button, select, input {
      font: inherit;
      min-height: 54px;
      border-radius: 15px;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
    }

    button:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 13px;
      font-size: 16px;
      outline: none;
    }

    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
    }

    .page.module-open {
      align-items: flex-start;
    }

    .shell {
      width: 100%;
    }

    .toast {
      position: fixed;
      z-index: 50;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -12px);
      min-width: 128px;
      max-width: calc(100vw - 28px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(16, 24, 40, .94);
      color: #fff;
      box-shadow: 0 14px 36px rgba(16, 43, 92, .22);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .panel {
      width: 100%;
      padding: 18px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .86);
      box-shadow: 0 22px 60px rgba(16, 43, 92, .14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      gap: 13px;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #101828, #123a8c);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(16, 43, 92, .24);
      flex: 0 0 auto;
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    .moduleGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .moduleEntry {
      min-height: 118px;
      padding: 18px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      text-align: left;
      box-shadow: 0 10px 22px rgba(16, 43, 92, .08);
    }

    .moduleEntry strong,
    .moduleEntry span {
      display: block;
    }

    .moduleEntry strong {
      font-size: 20px;
    }

    .moduleEntry span {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topbarActions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .refreshBtn,
    .backBtn {
      width: auto;
      min-width: 106px;
      min-height: 46px;
      padding: 10px 13px;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--line);
      font-size: 14px;
    }

    .backBtn {
      min-width: 82px;
      background: #fff;
    }

    .fieldLabel {
      display: block;
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
    }

    .stat {
      min-height: 76px;
      padding: 11px 8px;
      border-radius: 15px;
      background: var(--soft);
      border: 1px solid var(--line);
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
      line-height: 1;
    }

    .linkList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .quickList {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .quickMeta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .quickMeta div {
      min-width: 0;
      padding: 9px 10px;
      border-radius: 11px;
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .quickMeta strong {
      color: #344054;
    }

    .quickActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quickCopyBtn {
      min-height: 48px;
      color: #fff;
      font-size: 15px;
    }

    .quickCopyBtn:nth-child(1) {
      background: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
    }

    .quickCopyBtn:nth-child(2) {
      background: linear-gradient(135deg, #1268ff 0%, #0891b2 100%);
    }

    .quickCopyBtn:nth-child(3) {
      background: linear-gradient(135deg, #047857 0%, #16a34a 100%);
    }

    .quickCopyBtn:nth-child(4) {
      background: linear-gradient(135deg, #c2410c 0%, #e11d48 100%);
    }

    .quickCopyBtn:disabled {
      background: #d7dee8;
      color: #64748b;
      opacity: 1;
    }

    .productCard {
      display: grid;
      gap: 9px;
      padding: 12px 14px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 22px rgba(16, 43, 92, .08);
    }

    .productHead {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
    }

    .productName {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.25;
    }

    .productIndex {
      flex: 0 0 auto;
      min-width: 30px;
      height: 26px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(18, 104, 255, .10);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .productMeta {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .productMeta strong {
      color: #344054;
      font-weight: 900;
    }

    .productActions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .linkProductCard {
      gap: 7px;
      padding: 10px 11px;
      border-radius: 14px;
      box-shadow: 0 7px 16px rgba(16, 43, 92, .07);
    }

    .linkDetails {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .linkDetails div {
      overflow-wrap: anywhere;
    }

    .linkDetails strong {
      color: #344054;
      font-weight: 900;
    }

    .copyPidBtn {
      min-height: 42px;
      padding: 10px 8px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #9333ea 100%);
      color: #fff;
      font-size: 14px;
    }

    .copyPidBtn:disabled {
      background: #d7dee8;
      color: #64748b;
      opacity: 1;
    }

    .openLinkBtn {
      min-height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%);
      border: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .openLinkBtn.is-disabled {
      opacity: .48;
      pointer-events: none;
    }

    .empty {
      padding: 16px;
      border-radius: 15px;
      background: var(--soft);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--ok);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.55;
    }

    .status.warn {
      color: var(--warn);
    }

    @media (max-width: 620px) {
      .linkList {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .panel {
        border-radius: 17px;
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .moduleGrid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbarActions {
        flex-direction: column;
      }

      .refreshBtn,
      .backBtn {
        min-width: 88px;
      }

      h1 {
        font-size: 22px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <div id="copyToast" class="toast" role="status" aria-live="polite"></div>
  <main id="page" class="page">
    <section class="panel">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <h1>Mark的小工具</h1>
          <p class="sub">选择需要使用的工具。</p>
        </div>
      </div>

      <div id="homeView">
        <div class="moduleGrid">
          <button class="moduleEntry" type="button" data-open-view="quick">
            <strong>一键复制</strong>
            <span>查看手机和账号，复制对应字段内容</span>
          </button>
          <button class="moduleEntry" type="button" data-open-view="links">
            <strong>挂车链接</strong>
            <span>查看商品，复制 PID 或打开链接</span>
          </button>
        </div>
      </div>

      <div id="quickView" hidden>
        <div class="topbar">
          <h2>一键复制</h2>
          <div class="topbarActions">
            <button class="backBtn" type="button" data-open-view="home">返回首页</button>
            <button id="quickRefreshBtn" class="refreshBtn" type="button">刷新数据</button>
          </div>
        </div>
        <div id="quickList" class="quickList"></div>
        <div id="quickStatus" class="status" role="status" aria-live="polite"></div>
      </div>

      <div id="linkView" hidden>
        <div class="topbar">
          <h2>挂车链接</h2>
          <div class="topbarActions">
            <button class="backBtn" type="button" data-open-view="home">返回首页</button>
            <button id="refreshBtn" class="refreshBtn" type="button">刷新数据</button>
          </div>
        </div>

        <div id="linkList" class="linkList"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
    const QUICK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpepqJp8ZsCDVhDBQXaAeRxyf3XMatTImkj19AtvUTWw0EixwKehe-fV3waJzmNfTV_qKHCACJtBSk/pub?gid=2005332137&single=true&output=csv";
    const LINK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpepqJp8ZsCDVhDBQXaAeRxyf3XMatTImkj19AtvUTWw0EixwKehe-fV3waJzmNfTV_qKHCACJtBSk/pub?gid=1889161542&single=true&output=csv";
    const STORAGE_PREFIX = "mark_tools_link_only_v1_";

    const state = {
      items: [],
      loading: false,
      loaded: false
    };

    const quickState = {
      items: [],
      loading: false,
      loaded: false
    };

    const els = {};

    document.addEventListener("DOMContentLoaded", () => {
      cacheElements();
      bindEvents();
      hydrateState();
      openView("home");
    });

    function cacheElements() {
      [
        "copyToast",
        "page",
        "homeView",
        "quickView",
        "linkView",
        "quickRefreshBtn",
        "quickList",
        "quickStatus",
        "refreshBtn",
        "linkList",
        "status"
      ].forEach((id) => { els[id] = document.getElementById(id); });
    }

    function bindEvents() {
      document.addEventListener("click", (event) => {
        const viewButton = event.target.closest("[data-open-view]");
        if (viewButton) openView(viewButton.dataset.openView);
      });
      els.quickRefreshBtn.addEventListener("click", () => loadQuick(true));
      els.refreshBtn.addEventListener("click", () => loadLinks(true));
      els.linkList.addEventListener("click", (event) => {
        const pidButton = event.target.closest("[data-copy-pid]");
        if (pidButton) copyPid(pidButton.dataset.copyPid);
      });
      els.quickList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-quick-row][data-quick-field]");
        if (!button) return;
        const item = quickState.items.find((currentItem) => currentItem.rowKey === button.dataset.quickRow);
        const fieldNumber = Number(button.dataset.quickField);
        if (item && fieldNumber >= 1 && fieldNumber <= 4) {
          copyQuickField(item.fields[fieldNumber - 1], fieldNumber);
        }
      });
    }

    function openView(viewName) {
      const isQuick = viewName === "quick";
      const isLinks = viewName === "links";
      els.homeView.hidden = isQuick || isLinks;
      els.quickView.hidden = !isQuick;
      els.linkView.hidden = !isLinks;
      els.page.classList.toggle("module-open", isQuick || isLinks);
      window.scrollTo(0, 0);

      if (isQuick && !quickState.loaded && !quickState.loading) loadQuick(false);
      if (isLinks && !state.loaded && !state.loading) loadLinks(false);
    }

    function hydrateState() {
      return undefined;
    }

    async function loadQuick(forceRefresh) {
      quickState.loading = true;
      renderQuick();
      setQuickStatus(forceRefresh ? "正在刷新一键复制数据..." : "正在读取一键复制数据...", false, 0);

      try {
        quickState.items = parseQuickCsv(await fetchCsv(QUICK_CSV_URL, forceRefresh));
        setQuickStatus("已读取 " + quickState.items.length + " 条记录。");
      } catch (error) {
        quickState.items = [];
        setQuickStatus("一键复制数据读取失败，请检查 Google 表格发布链接。", true, 0);
      } finally {
        quickState.loading = false;
        quickState.loaded = true;
        renderQuick();
      }
    }

    async function loadLinks(forceRefresh) {
      state.loading = true;
      renderLinks();
      setStatus(forceRefresh ? "正在刷新挂车链接..." : "正在读取挂车链接...", false, 0);

      try {
        state.items = parseLinkCsv(await fetchCsv(LINK_CSV_URL, forceRefresh));
        setStatus("已读取 " + state.items.length + " 个商品链接。");
      } catch (error) {
        state.items = [];
        setStatus("挂车链接读取失败，请检查 Google 表格发布链接。", true, 0);
      } finally {
        state.loading = false;
        state.loaded = true;
        renderLinks();
      }
    }

    async function fetchCsv(url, forceRefresh) {
      const finalUrl = forceRefresh ? url + (url.includes("?") ? "&" : "?") + "t=" + Date.now() : url;
      const response = await fetch(finalUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.text();
    }

    function parseLinkCsv(csvText) {
      const rows = parseCsv(csvText);
      if (!rows.length) return [];

      const headers = rows[0].map((cell) => cleanCell(cell));
      const nameIndex = findHeader(headers, ["商品名称", "商品名"]);
      const pidIndex = findHeader(headers, ["PID"]);
      const linkIndex = findHeader(headers, ["挂车链接", "链接"]);
      if (linkIndex === -1) {
        throw new Error("CSV 缺少必要字段");
      }

      return rows.slice(1).reduce((result, row) => {
        const productName = nameIndex >= 0 ? cleanCell(row[nameIndex]) : "";
        const pid = pidIndex >= 0 ? cleanPid(row[pidIndex]) : "";
        const link = cleanCell(row[linkIndex]);
        if (!link) return result;
        result.push({
          productName,
          pid,
          link
        });
        return result;
      }, []);
    }

    function parseQuickCsv(csvText) {
      const rows = parseCsv(csvText);
      if (!rows.length) return [];

      const headers = rows[0].map((cell) => cleanCell(cell));
      const idIndex = findHeader(headers, ["序号", "编号"]);
      const phoneIndex = findHeader(headers, ["手机", "手机号"]);
      const accountIndex = findHeader(headers, ["账号", "账户"]);
      const fieldIndexes = [1, 2, 3, 4].map((number) => findHeader(headers, ["复制字段" + number, "字段" + number]));
      if (fieldIndexes.every((index) => index === -1)) {
        throw new Error("CSV 缺少复制字段");
      }

      return rows.slice(1).reduce((result, row, rowIndex) => {
        const fields = fieldIndexes.map((index) => index >= 0 ? cleanCell(row[index]) : "");
        if (!fields.some(Boolean)) return result;
        result.push({
          rowKey: String(rowIndex),
          index: idIndex >= 0 ? cleanCell(row[idIndex]) || String(rowIndex + 1) : String(rowIndex + 1),
          phone: phoneIndex >= 0 ? cleanCell(row[phoneIndex]) : "",
          account: accountIndex >= 0 ? cleanCell(row[accountIndex]) : "",
          fields
        });
        return result;
      }, []);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      row.push(cell);
      rows.push(row);
      return rows.filter((currentRow) => currentRow.some((cellValue) => cleanCell(cellValue) !== ""));
    }

    function renderQuick() {
      els.quickRefreshBtn.disabled = quickState.loading;

      if (quickState.loading) {
        els.quickList.innerHTML = '<div class="empty">正在读取一键复制数据...</div>';
        return;
      }

      if (!quickState.items.length) {
        els.quickList.innerHTML = '<div class="empty">没有读取到可复制内容，请检查 Google 表格。</div>';
        return;
      }

      els.quickList.innerHTML = quickState.items.map((item) => {
        const buttons = item.fields.map((value, fieldIndex) => {
          const fieldNumber = fieldIndex + 1;
          return '<button class="quickCopyBtn" type="button" data-quick-row="' + escapeHtml(item.rowKey) + '" data-quick-field="' + fieldNumber + '"' + (value ? "" : " disabled") + '>复制字段' + fieldNumber + '</button>';
        }).join("");

        return '<div class="productCard">' +
          '<div class="productHead"><span class="productIndex">' + escapeHtml(item.index) + '</span></div>' +
          '<div class="quickMeta">' +
          '<div><strong>手机：</strong>' + escapeHtml(item.phone || "无") + '</div>' +
          '<div><strong>账号：</strong>' + escapeHtml(item.account || "无") + '</div>' +
          '</div>' +
          '<div class="quickActions">' + buttons + '</div>' +
          '</div>';
      }).join("");
    }

    function renderLinks() {
      els.refreshBtn.disabled = state.loading;

      if (state.loading) {
        els.linkList.innerHTML = '<div class="empty">正在读取挂车链接...</div>';
        return;
      }

      if (!state.items.length) {
        els.linkList.innerHTML = '<div class="empty">没有读取到商品链接，请检查 Google 表格。</div>';
        return;
      }

      els.linkList.innerHTML = state.items.map((item) => {
        return '<div class="productCard linkProductCard">' +
          '<div class="linkDetails">' +
          '<div><strong>商品名称：</strong>' + escapeHtml(item.productName || "无") + '</div>' +
          '<div><strong>PID：</strong>' + escapeHtml(item.pid || "无") + '</div>' +
          '</div>' +
          '<div class="productActions">' +
          '<button class="copyPidBtn" type="button" data-copy-pid="' + escapeHtml(item.pid) + '"' + (item.pid ? "" : " disabled") + '>复制PID</button>' +
          '<a class="openLinkBtn" href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">打开链接</a>' +
          '</div>' +
          '</div>';
      }).join("");
    }

    async function copyPid(pid) {
      if (!pid) return;
      const ok = await copyText(pid);
      if (ok) showToast("PID 已复制");
      setStatus(ok ? "PID 已复制。" : "自动复制失败，请手动复制 PID：" + pid, !ok);
    }

    async function copyQuickField(value, fieldNumber) {
      if (!value) return;
      const ok = await copyText(value);
      if (ok) showToast("已复制字段" + fieldNumber);
      setQuickStatus(ok ? "已复制字段" + fieldNumber + "。" : "自动复制失败，请长按后手动复制。", !ok);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {}
      }
      return fallbackCopy(text);
    }

    function fallbackCopy(text) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.top = "-1000px";
        textarea.style.left = "-1000px";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        return ok;
      } catch (error) {
        return false;
      }
    }

    function setStatus(text, warning, duration) {
      els.status.textContent = text || "";
      els.status.className = warning ? "status warn" : "status";
      clearTimeout(els.status.__timer);
      if (text && duration !== 0) {
        els.status.__timer = setTimeout(() => {
          els.status.textContent = "";
          els.status.className = "status";
        }, duration || 1800);
      }
    }

    function setQuickStatus(text, warning, duration) {
      els.quickStatus.textContent = text || "";
      els.quickStatus.className = warning ? "status warn" : "status";
      clearTimeout(els.quickStatus.__timer);
      if (text && duration !== 0) {
        els.quickStatus.__timer = setTimeout(() => {
          els.quickStatus.textContent = "";
          els.quickStatus.className = "status";
        }, duration || 1800);
      }
    }

    function showToast(text) {
      els.copyToast.textContent = text;
      els.copyToast.classList.add("show");
      clearTimeout(els.copyToast.__timer);
      els.copyToast.__timer = setTimeout(() => {
        els.copyToast.classList.remove("show");
      }, 1300);
    }

    function findHeader(headers, names) {
      return headers.findIndex((header) => names.includes(header));
    }

    function cleanCell(value) {
      return String(value || "").trim();
    }

    function cleanPid(value) {
      return cleanCell(value).replace(/\D/g, "");
    }

    function isEmptyRow(row) {
      return row.every((cell) => cleanCell(cell) === "");
    }

    function save(key, value) {
      localStorage.setItem(STORAGE_PREFIX + key, typeof value === "string" ? value : JSON.stringify(value));
    }

    function readText(key, fallback) {
      return localStorage.getItem(STORAGE_PREFIX + key) || fallback;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
