<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mark的小工具">
  <title>Mark的小工具</title>
  <style>
    :root {
      --bg: #eef4fb;
      --panel: rgba(255, 255, 255, .88);
      --text: #101828;
      --muted: #64748b;
      --line: rgba(156, 178, 207, .42);
      --blue: #1268ff;
      --soft: #f3f7fc;
      --ok: #047857;
      --warn: #b42318;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 4%, rgba(65, 190, 255, .34), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(18, 104, 255, .24), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    button, select, input {
      font: inherit;
      min-height: 54px;
      border-radius: 15px;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
    }

    button:disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 0 13px;
      font-size: 16px;
      outline: none;
    }

    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
    }

    .shell {
      width: 100%;
    }

    .toast {
      position: fixed;
      z-index: 50;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -12px);
      min-width: 128px;
      max-width: calc(100vw - 28px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(16, 24, 40, .94);
      color: #fff;
      box-shadow: 0 14px 36px rgba(16, 43, 92, .22);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .panel {
      width: 100%;
      padding: 18px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .86);
      box-shadow: 0 22px 60px rgba(16, 43, 92, .14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      gap: 13px;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #101828, #123a8c);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(16, 43, 92, .24);
      flex: 0 0 auto;
    }

    h1, h2, p {
      margin: 0;
    }

    h1 {
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .refreshBtn {
      width: auto;
      min-width: 106px;
      min-height: 46px;
      padding: 10px 13px;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--line);
      font-size: 14px;
    }

    .fieldLabel {
      display: block;
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0;
    }

    .stat {
      min-height: 76px;
      padding: 11px 8px;
      border-radius: 15px;
      background: var(--soft);
      border: 1px solid var(--line);
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
      line-height: 1;
    }

    .linkList {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .productCard {
      display: grid;
      gap: 9px;
      padding: 12px 14px;
      border-radius: 17px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 22px rgba(16, 43, 92, .08);
    }

    .productHead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .productName {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.25;
    }

    .productIndex {
      flex: 0 0 auto;
      min-width: 36px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(18, 104, 255, .09);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .productMeta {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .productMeta strong {
      color: #344054;
      font-weight: 900;
    }

    .productActions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .copyPidBtn {
      min-height: 48px;
      background: #111827;
      color: #fff;
    }

    .openLinkBtn {
      min-height: 48px;
      border-radius: 15px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 17px;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .openLinkBtn.is-disabled {
      opacity: .48;
      pointer-events: none;
    }

    .empty {
      padding: 16px;
      border-radius: 15px;
      background: var(--soft);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--ok);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.55;
    }

    .status.warn {
      color: var(--warn);
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .panel {
        border-radius: 17px;
        padding: 15px;
      }

      .stats,
      .productActions {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 22px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <div id="copyToast" class="toast" role="status" aria-live="polite"></div>
  <main class="page">
    <section class="panel">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <h1>Mark的小工具</h1>
          <p class="sub">按手机号筛选挂车商品，复制 PID 或打开挂车链接。</p>
        </div>
      </div>

      <div class="topbar">
        <h2>挂车链接</h2>
        <button id="refreshBtn" class="refreshBtn" type="button">刷新数据</button>
      </div>

      <label class="fieldLabel" for="phoneSelect">选择手机号</label>
      <select id="phoneSelect"></select>

      <div class="stats">
        <div class="stat"><span>全部商品</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>当前手机号</span><strong id="visibleCount">0</strong></div>
      </div>

      <div id="linkList" class="linkList"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const LINK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpepqJp8ZsCDVhDBQXaAeRxyf3XMatTImkj19AtvUTWw0EixwKehe-fV3waJzmNfTV_qKHCACJtBSk/pub?gid=1889161542&single=true&output=csv";
    const STORAGE_PREFIX = "mark_tools_link_only_v1_";

    const state = {
      items: [],
      phones: [],
      currentPhone: "",
      loading: false
    };

    const els = {};

    document.addEventListener("DOMContentLoaded", () => {
      cacheElements();
      bindEvents();
      hydrateState();
      loadLinks(false);
    });

    function cacheElements() {
      [
        "copyToast",
        "refreshBtn",
        "phoneSelect",
        "totalCount",
        "visibleCount",
        "linkList",
        "status"
      ].forEach((id) => { els[id] = document.getElementById(id); });
    }

    function bindEvents() {
      els.refreshBtn.addEventListener("click", () => loadLinks(true));
      els.phoneSelect.addEventListener("change", () => {
        state.currentPhone = els.phoneSelect.value;
        save("phone", state.currentPhone);
        renderLinks();
      });
      els.linkList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-copy-pid]");
        if (!button) return;
        copyPid(button.dataset.copyPid);
      });
    }

    function hydrateState() {
      state.currentPhone = readText("phone", "");
    }

    async function loadLinks(forceRefresh) {
      state.loading = true;
      renderLinks();
      setStatus(forceRefresh ? "正在刷新挂车链接..." : "正在读取挂车链接...", false, 0);

      try {
        state.items = parseLinkCsv(await fetchCsv(LINK_CSV_URL, forceRefresh));
        initPhones();
        setStatus("已读取 " + state.items.length + " 个商品链接。");
      } catch (error) {
        state.items = [];
        state.phones = [];
        setStatus("挂车链接读取失败，请检查 Google 表格发布链接。", true, 0);
      } finally {
        state.loading = false;
        renderLinks();
      }
    }

    async function fetchCsv(url, forceRefresh) {
      const finalUrl = forceRefresh ? url + (url.includes("?") ? "&" : "?") + "t=" + Date.now() : url;
      const response = await fetch(finalUrl, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.text();
    }

    function parseLinkCsv(csvText) {
      const rows = parseCsv(csvText);
      if (!rows.length) return [];

      const headers = rows[0].map((cell) => cleanCell(cell));
      const idIndex = findHeader(headers, ["序号", "编号"]);
      const phoneIndex = findHeader(headers, ["手机号"]);
      const nameIndex = findHeader(headers, ["商品名称", "商品名"]);
      const pidIndex = findHeader(headers, ["PID"]);
      const linkIndex = findHeader(headers, ["挂车链接", "链接"]);
      if (phoneIndex === -1 || nameIndex === -1 || pidIndex === -1 || linkIndex === -1) {
        throw new Error("CSV 缺少必要字段");
      }

      return rows.slice(1).reduce((result, row, rowIndex) => {
        const phone = cleanCell(row[phoneIndex]);
        const productName = cleanCell(row[nameIndex]);
        const pid = cleanPid(row[pidIndex]);
        const link = cleanCell(row[linkIndex]);
        if (isEmptyRow(row) || !phone || !productName || !pid) return result;
        result.push({
          index: idIndex >= 0 ? cleanCell(row[idIndex]) || String(rowIndex + 1) : String(rowIndex + 1),
          phone,
          productName,
          pid,
          link
        });
        return result;
      }, []);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      row.push(cell);
      rows.push(row);
      return rows.filter((currentRow) => currentRow.some((cellValue) => cleanCell(cellValue) !== ""));
    }

    function initPhones() {
      state.phones = Array.from(new Set(state.items.map((item) => item.phone).filter(Boolean)));
      els.phoneSelect.innerHTML = state.phones.map((phone) => {
        return '<option value="' + escapeHtml(phone) + '">' + escapeHtml(phone) + '</option>';
      }).join("");

      if (!state.phones.includes(state.currentPhone)) {
        state.currentPhone = state.phones[0] || "";
        save("phone", state.currentPhone);
      }
      els.phoneSelect.value = state.currentPhone;
    }

    function renderLinks() {
      const filtered = state.items.filter((item) => item.phone === state.currentPhone);
      els.totalCount.textContent = state.items.length;
      els.visibleCount.textContent = filtered.length;
      els.refreshBtn.disabled = state.loading;
      els.phoneSelect.disabled = state.loading || state.phones.length === 0;

      if (state.loading) {
        els.linkList.innerHTML = '<div class="empty">正在读取挂车链接...</div>';
        return;
      }

      if (!state.items.length) {
        els.linkList.innerHTML = '<div class="empty">没有读取到商品链接，请检查 Google 表格。</div>';
        return;
      }

      if (!filtered.length) {
        els.linkList.innerHTML = '<div class="empty">当前手机号没有商品链接。</div>';
        return;
      }

      els.linkList.innerHTML = filtered.map((item) => {
        const hasLink = Boolean(item.link);
        return '<div class="productCard">' +
          '<div class="productHead">' +
          '<div class="productName">' + escapeHtml(item.productName) + '</div>' +
          '<div class="productIndex">' + escapeHtml(item.index) + '</div>' +
          '</div>' +
          '<div class="productMeta">' +
          '<div><strong>PID：</strong>' + escapeHtml(item.pid) + '</div>' +
          '<div><strong>链接：</strong>' + escapeHtml(item.link || "未填写") + '</div>' +
          '</div>' +
          '<div class="productActions">' +
          '<button class="copyPidBtn" type="button" data-copy-pid="' + escapeHtml(item.pid) + '">复制 PID</button>' +
          '<a class="openLinkBtn' + (hasLink ? "" : " is-disabled") + '" href="' + escapeHtml(hasLink ? item.link : "#") + '" target="_blank" rel="noopener">打开链接</a>' +
          '</div>' +
          '</div>';
      }).join("");
    }

    async function copyPid(pid) {
      if (!pid) return;
      const ok = await copyText(pid);
      if (ok) showToast("PID 已复制");
      setStatus(ok ? "PID 已复制。" : "自动复制失败，请手动复制 PID：" + pid, !ok);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {}
      }
      return fallbackCopy(text);
    }

    function fallbackCopy(text) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.top = "-1000px";
        textarea.style.left = "-1000px";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        return ok;
      } catch (error) {
        return false;
      }
    }

    function setStatus(text, warning, duration) {
      els.status.textContent = text || "";
      els.status.className = warning ? "status warn" : "status";
      clearTimeout(els.status.__timer);
      if (text && duration !== 0) {
        els.status.__timer = setTimeout(() => {
          els.status.textContent = "";
          els.status.className = "status";
        }, duration || 1800);
      }
    }

    function showToast(text) {
      els.copyToast.textContent = text;
      els.copyToast.classList.add("show");
      clearTimeout(els.copyToast.__timer);
      els.copyToast.__timer = setTimeout(() => {
        els.copyToast.classList.remove("show");
      }, 1300);
    }

    function findHeader(headers, names) {
      return headers.findIndex((header) => names.includes(header));
    }

    function cleanCell(value) {
      return String(value || "").trim();
    }

    function cleanPid(value) {
      return cleanCell(value).replace(/\D/g, "");
    }

    function isEmptyRow(row) {
      return row.every((cell) => cleanCell(cell) === "");
    }

    function save(key, value) {
      localStorage.setItem(STORAGE_PREFIX + key, typeof value === "string" ? value : JSON.stringify(value));
    }

    function readText(key, fallback) {
      return localStorage.getItem(STORAGE_PREFIX + key) || fallback;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
